# Quarto revealjs project for one lecture. Render with `quarto render`; the output is talk.html.
project:
  title: "課程名稱"
  render:
    - "talk.qmd"

format:
  revealjs:
    theme: [default, _theme/deck.scss]
    width: 1280
    height: 720
    slide-number: c/t
    menu: true
    progress: true
    hash: true
    center: false
    transition: fade
    background-transition: fade
    footer: "課程名稱 · 第 N 講"
    html-math-method: mathjax
